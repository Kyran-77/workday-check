<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1f3ed">
<title>你今天上班困了吗？</title>
<style>
*{box-sizing:border-box}
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#202626}
body{margin:0;min-height:100svh;background:#f1f3ed radial-gradient(#d9ddd4 .7px,transparent .7px) 0 0/18px 18px}
button{font:inherit}
.page{width:min(100%,760px);min-height:100svh;margin:auto;padding:24px;display:flex;flex-direction:column}
.top,.foot{display:flex;justify-content:space-between;color:#687572;font-size:12px}
main{flex:1;display:grid;place-items:center;text-align:center}
section{width:100%}
h1{margin:0;font-size:clamp(40px,10vw,68px);line-height:1.2;font-weight:900}
.stickers{display:flex;justify-content:center;gap:28px;margin:24px 0;font-size:clamp(48px,13vw,78px)}
.stickers span{animation:bob 2s ease-in-out infinite}.stickers span:nth-child(2){animation-delay:-.6s}.stickers span:nth-child(3){animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
.prompt,.foot{color:#687572}
.buttons{display:flex;gap:12px;width:min(100%,420px);margin:22px auto}
.buttons button,#again{min-height:58px;flex:1;border:1.5px solid;border-radius:5px;font-size:19px;font-weight:800;cursor:pointer}
.sleep,#again{background:#e85f4b;color:white;border-color:#e85f4b}.awake{background:#367568;color:white;border-color:#367568}
.buttons button:hover,#again:hover{box-shadow:3px 4px #202626;transform:translateY(-2px)}
.hidden{display:none!important}
.stage{position:relative;perspective:900px;width:min(100%,620px);height:clamp(340px,68svh,560px);margin:0 auto 18px;overflow:hidden;background:linear-gradient(#dfe9e5 0 66%,#af8c69 66%);box-shadow:inset 0 0 42px #20262620;isolation:isolate}
.stage:before{content:"";position:absolute;inset:auto 0 0;height:30%;z-index:0;background:linear-gradient(165deg,#c9a783,#927153);clip-path:polygon(0 24%,100% 0,100% 100%,0 100%)}
.stage:after{content:"";position:absolute;top:8%;left:5%;width:90%;height:45%;z-index:0;background:radial-gradient(circle at 18% 24%,#fff8 0 1px,transparent 2px),linear-gradient(135deg,#d9e9e2,#b8d1cb);opacity:.48}
.desk-scene{position:absolute;inset:0;z-index:1;pointer-events:none}.monitor{position:absolute;top:12%;left:50%;width:min(47vw,260px);height:31%;transform:translateX(-50%);border:10px solid #2d3b3b;border-radius:8px 8px 4px 4px;background:#263b3b;box-shadow:0 8px 0 #20262630}.monitor-screen{position:absolute;inset:9px;background:linear-gradient(145deg,#5b8f8c,#203a3b 62%,#152a2c)}.monitor-glow{position:absolute;left:12%;top:22%;width:46%;height:10%;background:#a9ddd1;border-radius:50%;filter:blur(9px);opacity:.42}.monitor-stand{position:absolute;top:43%;left:50%;width:18px;height:9%;transform:translateX(-50%);background:#2d3b3b}.monitor-base{position:absolute;top:51%;left:50%;width:110px;height:10px;transform:translateX(-50%);border-radius:50%;background:#2d3b3b}.desk-top{position:absolute;left:-4%;right:-4%;top:62%;height:9%;background:linear-gradient(#d8b58b,#b18a63);border-top:5px solid #8a674b;box-shadow:0 7px 0 #6d4f39}.keyboard{position:absolute;top:69%;left:50%;width:min(45vw,250px);height:10%;transform:translateX(-50%) perspective(160px) rotateX(35deg);border:4px solid #303b3b;border-radius:6px;background:repeating-linear-gradient(90deg,#d9dfd7 0 13px,#a9b6ae 14px 16px),repeating-linear-gradient(0deg,transparent 0 8px,#53625d 9px 10px);box-shadow:0 5px 0 #6d5542}.mousepad{position:absolute;top:69%;left:78%;width:16%;height:13%;border-radius:9px;background:#49635f;transform:rotate(-7deg);box-shadow:0 4px 0 #6d5542}.mouse{position:absolute;top:70%;left:81%;width:6%;height:9%;border-radius:50% 50% 45% 45%;background:#ced5ce;border:2px solid #384442;transform:rotate(-12deg);z-index:2}.mouse:after{content:"";position:absolute;top:15%;left:48%;width:2px;height:30%;background:#65736c}.mug{position:absolute;top:66%;left:10%;width:54px;height:55px;border:5px solid #e9e1d2;border-radius:5px 5px 14px 14px;background:#bd6750;box-shadow:0 5px 0 #6d5542}.mug:after{content:"";position:absolute;top:8px;right:-22px;width:20px;height:24px;border:5px solid #e9e1d2;border-left:0;border-radius:0 14px 14px 0}.sticky{position:absolute;top:72%;left:28%;width:46px;height:38px;transform:rotate(-8deg);background:#f4d57d;box-shadow:2px 4px 0 #8c704d}.sticky:after{content:"TODO";position:absolute;top:10px;left:7px;color:#8d6b3c;font:bold 8px monospace}
.label{position:absolute;top:13px;left:15px;z-index:5;color:#425a55;font-size:11px;letter-spacing:.08em}
.hand-left,.hand-right{position:absolute;top:52%;z-index:3;font-size:clamp(190px,55vw,340px);line-height:1;opacity:0;filter:drop-shadow(0 12px 5px #20262635);pointer-events:none}.hand-left{left:50%;transform:translate(-50%,-85%) scale(.16) rotate(90deg) scaleX(-1) rotate(-18deg)}.hand-right{right:50%;transform:translate(50%,-85%) scale(.16) rotate(-90deg) rotate(18deg)}
.screen-flash{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none}.hit-left .screen-flash{background:radial-gradient(ellipse at 8% 52%,#ffffff 0,rgba(255,255,255,.75) 12%,transparent 58%);animation:flash .2s .37s ease-out both}.hit-right .screen-flash{background:radial-gradient(ellipse at 92% 52%,#ffffff 0,rgba(255,255,255,.75) 12%,transparent 58%);animation:flash .2s .37s ease-out both}@keyframes flash{25%{opacity:.85}100%{opacity:0}}.impact{position:absolute;top:42%;left:50%;z-index:5;color:#e85f4b;font-size:clamp(38px,10vw,64px);font-weight:1000;opacity:0;transform:translate(-50%,-50%);text-shadow:0 2px 0 #fff}
.hit-left .hand-left{animation:slap .64s cubic-bezier(.16,.75,.2,1) both}.hit-right .hand-right{animation:slap-right .64s cubic-bezier(.16,.75,.2,1) both}.hit-left .impact{left:27%;animation:pop .42s .4s ease-out both}.hit-right .impact{left:73%;animation:pop .42s .4s ease-out both}
@keyframes slap{0%{opacity:.08;transform:translate(-50%,-85%) scale(.16) rotate(90deg) scaleX(-1) rotate(-18deg)}26%{opacity:.78;transform:translate(-54%,-70%) scale(.5) rotate(90deg) scaleX(-1) rotate(-8deg)}53%{opacity:1;transform:translate(-60%,-52%) scale(1.15) rotate(90deg) scaleX(-1) rotate(5deg)}66%{opacity:1;transform:translate(-75%,-50%) scale(1.5) rotate(90deg) scaleX(-1)}76%{opacity:1;transform:translate(-100%,-50%) scale(1.65) rotate(90deg) scaleX(-1)}100%{opacity:0;transform:translate(-160%,-48%) scale(1.85) rotate(90deg) scaleX(-1) rotate(5deg)}}@keyframes slap-right{0%{opacity:.08;transform:translate(50%,-85%) scale(.16) rotate(-90deg) rotate(18deg)}26%{opacity:.78;transform:translate(54%,-70%) scale(.5) rotate(-90deg) rotate(8deg)}53%{opacity:1;transform:translate(60%,-52%) scale(1.15) rotate(-90deg) rotate(-5deg)}66%{opacity:1;transform:translate(75%,-50%) scale(1.5) rotate(-90deg)}76%{opacity:1;transform:translate(100%,-50%) scale(1.65) rotate(-90deg)}100%{opacity:0;transform:translate(160%,-48%) scale(1.85) rotate(-90deg) rotate(-5deg)}}
@keyframes pop{45%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.page.shake-left{animation:recoil-right .38s .4s ease-out both}.page.shake-right{animation:recoil-left .38s .4s ease-out both}
@keyframes recoil-right{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(13px,1px) rotate(.8deg)}43%{transform:translate(20px,3px) rotate(1.2deg)}68%{transform:translate(-4px,-1px) rotate(-.3deg)}84%{transform:translate(3px,0) rotate(.1deg)}}@keyframes recoil-left{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-13px,1px) rotate(-.8deg)}43%{transform:translate(-20px,3px) rotate(-1.2deg)}68%{transform:translate(4px,-1px) rotate(.3deg)}84%{transform:translate(-3px,0) rotate(-.1deg)}}
.count{margin:0 0 12px;color:#687572;font-size:14px}#again{width:min(100%,420px);flex:none}
.exit{padding:40px 0}.exit strong{font-size:80px}.foot{justify-content:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:480px){.page{padding:20px 18px}.top{gap:10px}.top span:last-child{text-align:right}.stage{height:clamp(340px,58svh,460px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="page"><header class="top"><span>打工人精神状态检测</span><span>WORKDAY CHECK · POV</span></header><main>
<section id="start"><h1>你今天上班<br>困了吗？</h1><div class="stickers"><span>🥱</span><span>☕</span><span>🫠</span></div><p class="prompt">诚实回答，脸已经准备好了。</p><div class="buttons"><button class="sleep" id="sleep">困了</button><button class="awake" id="awake">不困</button></div></section>
<section id="slap" class="hidden"><div class="stage" id="stage" aria-live="polite"><span class="label">第一人称 · 工位醒神视角</span><div class="desk-scene" aria-hidden="true"><div class="monitor"><div class="monitor-screen"><span class="monitor-glow"></span></div></div><div class="monitor-stand"></div><div class="monitor-base"></div><div class="desk-top"></div><div class="keyboard"></div><div class="mousepad"></div><div class="mouse"></div><div class="mug"></div><div class="sticky"></div></div><div class="hand-left" aria-hidden="true">🖐️</div><div class="hand-right" aria-hidden="true">🖐️</div><div class="screen-flash" aria-hidden="true"></div><div class="impact" aria-hidden="true">啪！</div></div><p class="count" id="count">醒神 0 次</p><button id="again">再扇一下！</button></section>
<section id="exit" class="exit hidden" aria-live="polite"><strong>😎</strong><p>精神抖擞，放你回去上班！</p></section></main><footer class="foot">摸鱼一分钟，继续搬砖。</footer><div class="sr" id="status" aria-live="polite"></div></div>
<script>
const $=s=>document.querySelector(s);let hits=0;
function hit(){hits++;const side=hits%2===1?"left":"right";$("#count").textContent="醒神 "+hits+" 次";$("#status").textContent="啪！"+(side==="left"?"左边":"右边")+"醒神 "+hits+" 次";const stage=$("#stage"),page=$(".page");stage.classList.remove("hit-left","hit-right");page.classList.remove("shake-left","shake-right");void stage.offsetWidth;stage.classList.add("hit-"+side);page.classList.add("shake-"+side);if(navigator.vibrate)navigator.vibrate([80,35,55])}
$("#sleep").onclick=()=>{$("#start").classList.add("hidden");$("#slap").classList.remove("hidden");hit()};$("#again").onclick=hit;$("#awake").onclick=()=>{window.close();$("#start").classList.add("hidden");$("#exit").classList.remove("hidden")};
</script>
</body></html>
