<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ec"><title>你今天上班困了吗？</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7f3ec radial-gradient(#ded9cf .7px,transparent .7px) 0 0/18px 18px;color:#202626;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}.page{width:min(100%,760px);min-height:100svh;margin:auto;padding:26px 24px;display:flex;flex-direction:column}.top,.foot{display:flex;justify-content:space-between;color:#737a78;font-size:12px}main{flex:1;display:grid;place-items:center;text-align:center}section{width:100%}h1{font-size:clamp(40px,10vw,68px);line-height:1.2;margin:0;font-weight:900}.stickers{margin:24px 0;font-size:clamp(48px,13vw,78px);display:flex;justify-content:center;gap:28px}.stickers span{animation:bob 2s ease-in-out infinite}.stickers span:nth-child(2){animation-delay:-.6s}.stickers span:nth-child(3){animation-delay:-1.2s}@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}.prompt,.foot{color:#737a78}.buttons{display:flex;gap:12px;width:min(100%,420px);margin:22px auto}.buttons button,#again{min-height:58px;flex:1;border:1.5px solid;border-radius:5px;font:800 19px inherit;cursor:pointer}.sleep,#again{background:#e85f4b;color:white;border-color:#e85f4b}.awake{background:#367568;color:white;border-color:#367568}.buttons button:hover,#again:hover{box-shadow:3px 4px #202626;transform:translateY(-2px)}.hidden{display:none!important}.stage{position:relative;width:min(100%,540px);height:clamp(240px,57vw,340px);margin:0 auto 20px;display:grid;place-items:center;overflow:hidden;border:2px solid #202626;border-radius:8px;background:#fffdf9;box-shadow:7px 7px #202626}.label{position:absolute;top:12px;left:14px;color:#737a78;font-size:11px}.face{width:min(52vw,220px);aspect-ratio:1;border:2px solid #202626;border-radius:50%;background:#f4c9a9;display:grid;place-items:center;font-size:clamp(100px,25vw,150px);line-height:1;z-index:1}.hand{position:absolute;z-index:2;top:50%;left:-30%;font-size:clamp(100px,26vw,160px);opacity:0;transform:translate(-30%,-50%) rotate(-28deg) scaleX(-1)}.impact{position:absolute;z-index:3;top:50%;left:50%;font-size:clamp(32px,9vw,54px);font-weight:1000;color:#e85f4b;opacity:0}.hit .hand{animation:slap .5s ease both}.hit .face{animation:face .5s ease both}.hit .impact{animation:pop .38s .19s ease-out both}.shake{animation:shake .36s ease-in-out}@keyframes slap{0%{opacity:1;transform:translate(-30%,-50%) rotate(-28deg) scaleX(-1)}48%{opacity:1;transform:translate(100%,-50%) rotate(8deg) scaleX(-1)}62%{opacity:1;transform:translate(92%,-50%) scaleX(-1)}100%{opacity:0;transform:translate(150%,-50%) rotate(15deg) scaleX(-1)}}@keyframes face{0%,42%{transform:none}54%{transform:translateX(18px) rotate(13deg) scaleX(.94)}72%{transform:translateX(-8px) rotate(-6deg)}100%{transform:none}}@keyframes pop{45%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}@keyframes shake{20%{transform:translate(-7px,2px) rotate(-1deg)}40%{transform:translate(6px,-3px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}.count{color:#737a78;font-size:14px}#again{width:min(100%,420px);flex:none}.exit{padding:40px 0}.exit strong{font-size:80px}.foot{justify-content:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<div class="page"><header class="top"><span>打工人精神状态检测</span><span>WORKDAY CHECK · 01</span></header><main>
<section id="start"><h1>你今天上班<br>困了吗？</h1><div class="stickers"><span>🥱</span><span>☕</span><span>🫠</span></div><p class="prompt">诚实回答，脸已经准备好了。</p><div class="buttons"><button class="sleep" id="sleep">困了</button><button class="awake" id="awake">不困</button></div></section>
<section id="slap" class="hidden"><div class="stage" id="stage" aria-live="polite"><span class="label">醒神模式 · 无限续杯</span><div class="face" id="face">😴</div><div class="hand" aria-hidden="true">🖐️</div><div class="impact" aria-hidden="true">啪！</div></div><p class="count" id="count">醒神 0 次</p><button id="again">再扇一下！</button></section>
<section id="exit" class="exit hidden" aria-live="polite"><strong>😎</strong><p>精神抖擞，放你回去上班！</p></section></main><footer class="foot">摸鱼一分钟，继续搬砖。</footer><div class="sr" id="status" aria-live="polite"></div></div>
<script>
const $=s=>document.querySelector(s);let hits=0;
function hit(){hits++;$("#count").textContent=`醒神 ${hits} 次`;$("#status").textContent=`啪！醒神 ${hits} 次`;const s=$("#stage");s.classList.remove("hit","shake");void s.offsetWidth;s.classList.add("hit","shake");$("#face").textContent=hits%3===0?"😵":"😳";if(navigator.vibrate)navigator.vibrate([70,35,45])}
$("#sleep").onclick=()=>{$("#start").classList.add("hidden");$("#slap").classList.remove("hidden");hit()};$("#again").onclick=hit;$("#awake").onclick=()=>{window.close();$("#start").classList.add("hidden");$("#exit").classList.remove("hidden")};
</script>
