<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1f3ed">
<title>你今天上班困了吗？</title>
<style>
*{box-sizing:border-box}
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#202626}
body{margin:0;min-height:100svh;background:#f1f3ed radial-gradient(#d9ddd4 .7px,transparent .7px) 0 0/18px 18px}
button{font:inherit}
.page{width:min(100%,760px);min-height:100svh;margin:auto;padding:24px;display:flex;flex-direction:column}
.top,.foot{display:flex;justify-content:space-between;color:#687572;font-size:12px}
main{flex:1;display:grid;place-items:center;text-align:center}
section{width:100%}
h1{margin:0;font-size:clamp(40px,10vw,68px);line-height:1.2;font-weight:900}
.stickers{display:flex;justify-content:center;gap:28px;margin:24px 0;font-size:clamp(48px,13vw,78px)}
.stickers span{animation:bob 2s ease-in-out infinite}.stickers span:nth-child(2){animation-delay:-.6s}.stickers span:nth-child(3){animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
.prompt,.foot{color:#687572}
.buttons{display:flex;gap:12px;width:min(100%,420px);margin:22px auto}
.buttons button,#again{min-height:58px;flex:1;border:1.5px solid;border-radius:5px;font-size:19px;font-weight:800;cursor:pointer}
.sleep,#again{background:#e85f4b;color:white;border-color:#e85f4b}.awake{background:#367568;color:white;border-color:#367568}
.buttons button:hover,#again:hover{box-shadow:3px 4px #202626;transform:translateY(-2px)}
.hidden{display:none!important}
.stage{position:relative;width:min(100%,620px);height:clamp(340px,68svh,560px);margin:0 auto 18px;overflow:hidden;background:linear-gradient(#e4efed 0 68%,#cdbb9f 68%);isolation:isolate}
.stage:before{content:"";position:absolute;inset:auto 0 0;height:30%;z-index:0;background:linear-gradient(165deg,#cdbb9f,#9f8668);clip-path:polygon(0 28%,100% 0,100% 100%,0 100%)}
.stage:after{content:"";position:absolute;top:18%;left:9%;width:82%;height:29%;z-index:0;border:8px solid #fffdf9;background:linear-gradient(135deg,#bedddb,#dce9de);box-shadow:0 3px 0 #8b9f98}
.label{position:absolute;top:13px;left:15px;z-index:5;color:#425a55;font-size:11px;letter-spacing:.08em}
.face{position:absolute;top:31%;left:50%;z-index:1;display:grid;place-items:center;width:min(46vw,230px);aspect-ratio:1;border:2px solid #202626;border-radius:50%;background:#f4c9a9;font-size:clamp(108px,26vw,156px);line-height:1;transform:translateX(-50%);filter:drop-shadow(0 10px 0 #20262622)}
.hand{position:absolute;left:50%;bottom:-10%;z-index:3;font-size:clamp(150px,42vw,260px);line-height:1;opacity:0;transform:translate(-50%,45%) scale(.48) rotate(-22deg);transform-origin:50% 85%;filter:drop-shadow(0 12px 5px #20262635);pointer-events:none}
.impact{position:absolute;top:42%;left:50%;z-index:4;color:#e85f4b;font-size:clamp(38px,10vw,64px);font-weight:1000;opacity:0;transform:translate(-50%,-50%)}
.hit .hand{animation:slap .58s cubic-bezier(.16,.75,.2,1) both}.hit .face{animation:face-hit .58s ease both}.hit .impact{animation:pop .42s .22s ease-out both}
@keyframes slap{0%{opacity:0;transform:translate(-50%,48%) scale(.48) rotate(-22deg)}30%{opacity:1;transform:translate(-50%,5%) scale(.88) rotate(-10deg)}48%{opacity:1;transform:translate(-50%,-20%) scale(1.48) rotate(5deg)}60%{opacity:1;transform:translate(-50%,-26%) scale(1.78)}100%{opacity:0;transform:translate(-50%,-32%) scale(2.05) rotate(3deg)}}
@keyframes face-hit{0%,43%{transform:translateX(-50%)}53%{transform:translateX(calc(-50% + 22px)) rotate(14deg) scale(.94)}72%{transform:translateX(calc(-50% - 8px)) rotate(-6deg)}100%{transform:translateX(-50%)}}
@keyframes pop{45%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.page.shake{animation:shake .42s ease-in-out}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-4px) rotate(1deg)}60%{transform:translate(-5px,2px) rotate(-.6deg)}80%{transform:translate(4px,-2px) rotate(.5deg)}}
.count{margin:0 0 12px;color:#687572;font-size:14px}#again{width:min(100%,420px);flex:none}
.exit{padding:40px 0}.exit strong{font-size:80px}.foot{justify-content:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:480px){.page{padding:20px 18px}.top{gap:10px}.top span:last-child{text-align:right}.stage{height:clamp(340px,58svh,460px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="page"><header class="top"><span>打工人精神状态检测</span><span>WORKDAY CHECK · POV</span></header><main>
<section id="start"><h1>你今天上班<br>困了吗？</h1><div class="stickers"><span>🥱</span><span>☕</span><span>🫠</span></div><p class="prompt">诚实回答，脸已经准备好了。</p><div class="buttons"><button class="sleep" id="sleep">困了</button><button class="awake" id="awake">不困</button></div></section>
<section id="slap" class="hidden"><div class="stage" id="stage" aria-live="polite"><span class="label">第一人称 · 工位醒神视角</span><div class="face" id="face">😴</div><div class="hand" aria-hidden="true">🖐️</div><div class="impact" aria-hidden="true">啪！</div></div><p class="count" id="count">醒神 0 次</p><button id="again">再扇一下！</button></section>
<section id="exit" class="exit hidden" aria-live="polite"><strong>😎</strong><p>精神抖擞，放你回去上班！</p></section></main><footer class="foot">摸鱼一分钟，继续搬砖。</footer><div class="sr" id="status" aria-live="polite"></div></div>
<script>
const $=s=>document.querySelector(s);let hits=0;
function hit(){hits++;$("#count").textContent="醒神 "+hits+" 次";$("#status").textContent="啪！醒神 "+hits+" 次";const stage=$("#stage"),page=$(".page");stage.classList.remove("hit");page.classList.remove("shake");void stage.offsetWidth;stage.classList.add("hit");page.classList.add("shake");$("#face").textContent=hits%3===0?"😵":"😳";if(navigator.vibrate)navigator.vibrate([80,35,55])}
$("#sleep").onclick=()=>{$("#start").classList.add("hidden");$("#slap").classList.remove("hidden");hit()};$("#again").onclick=hit;$("#awake").onclick=()=>{window.close();$("#start").classList.add("hidden");$("#exit").classList.remove("hidden")};
</script>
</body></html>
